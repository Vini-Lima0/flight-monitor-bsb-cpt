name: Monitor de preços de passagens

on:
  schedule:
    # A cada 30 minutos. Cron do GitHub Actions é sempre em UTC.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

permissions:
  contents: write # necessário para o job commitar o histórico atualizado

concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar o monitor de preços
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python flight_monitor.py

      - name: Salvar histórico atualizado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.csv data/alert_state.json
          if git diff --cached --quiet; then
            echo "Nada novo para commitar"
          else
            git commit -m "chore: atualiza histórico de preços [skip ci]"
            git push
          fi
