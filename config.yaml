# ============================================================
# Configuração da rota monitorada.
# Edite os valores abaixo para trocar rota, datas ou preço-limite.
# Nada aqui é segredo — tokens e senhas ficam em Secrets (ver README).
# ============================================================

# <-- EDITE AQUI: código IATA do aeroporto de origem
origem: "BSB"

# <-- EDITE AQUI: código IATA do aeroporto de destino
destino: "CPT"

# <-- EDITE AQUI: data de ida DESEJADA da viagem (formato AAAA-MM-DD)
# Se essa data estiver a mais de "horizonte_max_dias" de hoje (a maioria das
# companhias/Google Flights não deixa buscar tão longe), o bot busca
# automaticamente a data máxima disponível e vai se aproximando dessa data
# alvo a cada execução, até ela entrar no horizonte de busca — ver README.
data_ida_alvo: "2027-11-05"

# <-- EDITE AQUI: data de volta DESEJADA da viagem (formato AAAA-MM-DD)
data_volta_alvo: "2027-11-15"

# <-- EDITE AQUI (raramente precisa): quantos dias de antecedência a maioria
# das companhias aéreas permite buscar/comprar. 330 é um valor conservador
# e comum entre companhias internacionais.
horizonte_max_dias: 330

# <-- EDITE AQUI: preço-limite. Qualquer leitura abaixo disso dispara alerta.
preco_limite: 6500

# <-- EDITE AQUI: moeda usada na busca e nos alertas
moeda: "BRL"

# <-- EDITE AQUI: e-mail que vai receber os alertas
destinatario_email: "vinilpmoreira@gmail.com"
