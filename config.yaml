# ============================================================
# Configuração da rota monitorada.
# Edite os valores abaixo para trocar rota, mês, duração ou preço-limite.
# Nada aqui é segredo — o token do Telegram fica em Secrets (ver README).
# ============================================================

# <-- EDITE AQUI: código IATA do aeroporto de origem
origem: "BSB"

# <-- EDITE AQUI: código IATA do aeroporto de destino
destino: "SDU"

# <-- EDITE AQUI: mês da viagem (AAAA-MM). As datas são flexíveis DENTRO
# deste mês: o bot testa todas as datas de ida do mês e fica com a
# combinação mais barata.
mes_alvo: "2027-05"

# <-- EDITE AQUI: quantos dias de viagem (ida -> volta)
duracao_dias: 7

# <-- EDITE AQUI (raramente precisa): quantos dias de antecedência a maioria
# das companhias aéreas permite buscar/comprar. Se o mês alvo ainda estiver
# além disso, o bot busca a data máxima alcançável e se aproxima do mês alvo
# conforme o tempo passa — ver README.
horizonte_max_dias: 330

# <-- EDITE AQUI: preço-limite. SÓ dispara alerta abaixo deste valor.
preco_limite: 600

# <-- EDITE AQUI: moeda usada na busca e nos alertas
moeda: "BRL"
